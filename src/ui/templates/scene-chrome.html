<!-- gev:template scene-chrome -->
<style>
  :root {
    --gev-panel-bg: rgba(10, 10, 20, 0.6);
    --gev-panel-bg-hover: rgba(15, 15, 30, 0.7);
    --gev-panel-border: rgba(255, 255, 255, 0.15);
    --gev-panel-border-focus: rgba(255, 255, 255, 0.4);
    --gev-panel-fg: #e0e0e8;
    --gev-panel-fg-muted: #808090;
    --gev-panel-accent: #00d4aa;
    --gev-radius: 8px;
    --gev-border-width: 1px;
    --gev-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
    --gev-shadow-hover: 0 6px 20px rgba(0, 0, 0, 0.4);
    --gev-transition-base: 180ms ease-out;
    --gev-transition-hover: 150ms ease-in;
  }

  #global-context-panel {
    background: var(--gev-panel-bg);
    border: var(--gev-border-width) solid var(--gev-panel-border);
    border-radius: var(--gev-radius);
    backdrop-filter: blur(10px);
    transition: background var(--gev-transition-base),
                border var(--gev-transition-base);
  }
  #global-context-panel:hover {
    background: var(--gev-panel-bg-hover);
    border-color: var(--gev-panel-border-focus);
  }

  .panel-collapsible {
    background: var(--gev-panel-bg);
    border: var(--gev-border-width) solid var(--gev-panel-border);
    border-radius: var(--gev-radius);
    backdrop-filter: blur(10px);
    transition: background var(--gev-transition-base),
                border var(--gev-transition-base);
  }
  .panel-collapsible:hover {
    background: var(--gev-panel-bg-hover);
  }

  .panel-header {
    color: var(--gev-panel-fg);
    transition: color var(--gev-transition-hover);
  }
  .panel-header:hover {
    color: var(--gev-panel-accent);
  }

  .panel-divider {
    border-color: var(--gev-panel-border);
  }

  .dock-tray-toggle:hover {
    background: rgba(255, 255, 255, 0.08);
  }

  .style-btn:hover {
    background: rgba(255, 255, 255, 0.06);
    color: var(--gev-panel-accent);
  }

  .panel-mini-status {
    color: var(--gev-panel-fg-muted);
  }

  #context-radio-dock {
    background: var(--gev-panel-bg);
    border: var(--gev-border-width) solid var(--gev-panel-border);
    border-radius: var(--gev-radius);
    backdrop-filter: blur(10px);
  }

  /* No local override here: `modern.css` already renders #title-bar with the
     exact same surface chrome as the top dock (`#top-center-actions`) —
     var(--surface-panel), var(--border-subtle), var(--panel-radius),
     var(--modern-shadow-md). The former rgba(10,10,20,0.5) was translucent;
     deleting it makes the chip as opaque as the dock. */
</style>
<div id="cesiumContainer"></div>
<div id="world-overlay-root" aria-hidden="true">
  <canvas id="world-overlay-canvas"></canvas>
</div>
<div
  id="world-overlay-actions"
  class="world-overlay-accessibility"
  role="region"
  aria-label="Visible map targets"
  data-i18n-aria-label
>
  <div id="world-overlay-action-list"></div>
  <div
    id="world-overlay-status"
    role="status"
    aria-live="polite"
    aria-atomic="true"
  ></div>
</div>

<!-- Title -->
<div id="title-bar">
  <div class="title-glow"></div>
  <h1>
    <span class="title-logo brand-logo" aria-hidden="true"
      ><img src="/logo.svg" alt=""
    /></span>
    <span translate="no">ODIN</span>
  </h1>
  <p class="subtitle" data-i18n>NO PLACE LEFT BEHIND</p>
</div>

<!-- Top-center camera and share actions -->
<nav id="top-center-actions" aria-label="Globe actions" data-i18n-aria-label>
  <button
    id="clear-selected-layers"
    type="button"
    aria-label="Clear selected data layers"
    title="Turn off all selected data layers"
    data-i18n-aria-label
    data-i18n-title
  >
    <span class="material-symbols-outlined" aria-hidden="true"
      >layers_clear</span
    >
  </button>
  <button
    id="share-btn"
    type="button"
    aria-label="Copy share link"
    title="Copy share link"
    data-i18n-aria-label
    data-i18n-title
  >
    <span class="share-icon" aria-hidden="true">&#x1F517;</span>
  </button>
  <button
    id="tilt-map-view"
    type="button"
    aria-label="Tilt map to oblique view"
    aria-pressed="false"
    title="Toggle straight-down and tilted map views"
    data-i18n-aria-label
    data-i18n-title
  >
    <span class="material-symbols-outlined" aria-hidden="true">view_in_ar</span>
  </button>
  <button
    id="north-up-view"
    type="button"
    aria-label="Reset map to north up"
    title="Reset map bearing to north"
    data-i18n-aria-label
    data-i18n-title
  >
    <span class="camera-compass-n" aria-hidden="true">N</span>
    <span
      class="camera-compass-needle material-symbols-outlined"
      aria-hidden="true"
      >navigation</span
    >
  </button>
  <button
    id="reset-globe-view"
    type="button"
    aria-label="Reset to full globe view"
    title="Reset camera and return to full globe view"
    data-i18n-aria-label
    data-i18n-title
  >
    <span class="material-symbols-outlined" aria-hidden="true">public</span>
  </button>
  <button
    id="settings-btn"
    type="button"
    aria-label="General settings"
    aria-pressed="false"
    title="General settings"
    data-i18n-aria-label
    data-i18n-title
  >
    <span class="material-symbols-outlined" aria-hidden="true">settings</span>
  </button>
  <div id="locale-picker"></div>
</nav>

<!-- General settings — opened by the gear in the top dock. Local data is a
     rubrique here, never an independent dock icon. -->
<aside id="general-settings" role="dialog" aria-modal="false" aria-labelledby="general-settings-title" hidden>
  <header class="gs-header">
    <span class="gs-kicker" data-i18n>GROUND STATION · SETTINGS</span>
    <h2 id="general-settings-title" data-i18n>General settings</h2>
    <button type="button" class="gs-close" data-role="close" aria-label="Close settings" data-i18n-aria-label>
      <span class="material-symbols-outlined" aria-hidden="true">close</span>
    </button>
  </header>
  <div class="gs-body">
    <nav class="gs-nav" data-role="rubriques" aria-label="Settings sections" data-i18n-aria-label></nav>
    <div class="gs-content" data-role="content"></div>
  </div>
</aside>
<div
  id="global-loading-status"
  role="status"
  aria-live="polite"
  aria-atomic="true"
  hidden
>
  <span id="global-loading-label" data-i18n>LOADING LIVE DATA</span>
  <span id="global-loading-detail"></span>
</div>
<div id="traffic-sync-chip" aria-live="polite">
  <span id="traffic-sync-label" data-i18n>syncing road network</span>
  <span id="traffic-sync-progress">0%</span>
</div>
<div id="cctv-sync-chip" aria-live="polite">
  <span id="cctv-sync-label" data-i18n>loading frames</span>
  <span id="cctv-sync-progress">0/0</span>
</div>

<!-- Toast notification -->
<div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<!-- Safe frame guides for recording composition -->
<div id="safe-frame-overlay">
  <div id="safe-frame-box"></div>
</div>
